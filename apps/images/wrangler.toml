name = "found-images"
main = "src/index.ts"
compatibility_date = "2026-08-04"

# 公開Routeとworkers.devを持たず、found-apiのService Bindingからだけ到達させる。
workers_dev = false

# 既存APIと同じR2原本を読む。派生画像はR2へ保存しない。
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "found-images"

# R2から読み出したバイト列をWorker内で固定variantへ変換する。
[images]
binding = "IMAGE_TRANSFORMATIONS"

# このWorkerだけをWorkers Cacheの対象にする。API Workerには設定しない。
[cache]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
