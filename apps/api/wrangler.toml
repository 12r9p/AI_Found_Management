name = "found-api"
main = "src/worker.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# R2 バケット（遺失物画像）。本番デプロイ前に `wrangler r2 bucket create found-images` を実行。
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "found-images"

# Postgres への低レイテンシ接続に Hyperdrive を使う場合（任意）。
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<your-hyperdrive-id>"

[vars]
WEB_ORIGIN = "http://localhost:3000"
AI_BASE_URL = "https://api.openai.com/v1"
AI_VISION_MODEL = "gpt-5.6-luna"
AI_EMBED_MODEL = "text-embedding-3-small"
AI_EFFORT = "low"
EMBED_DIM = "1536"
MATCH_THRESHOLD = "0.5"

# シークレットは wrangler secret put で設定:
#   wrangler secret put DATABASE_URL
#   wrangler secret put AI_API_KEY

# Cloudflare Access 検証（設定すると API も JWT を検証する）
# ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
# ACCESS_AUD = "<application audience tag>"
